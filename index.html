<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6EF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="HomeCare — משימות הבית, במקום אחד" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>HomeCare</title>
    <script>
      // Apply the saved theme before first paint (no flash). Values: 'system' | 'light' | 'dark'.
      // Settings (step 4.3) writes localStorage['homecare.theme'] and sets <html data-theme>.
      try {
        var t = localStorage.getItem('homecare.theme');
        if (t === 'light' || t === 'dark' || t === 'system')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
