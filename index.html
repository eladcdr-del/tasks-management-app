<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1714" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="HomeCare — משימות הבית, במקום אחד" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <title>HomeCare</title>
    <script>
      // Apply the saved theme before first paint (no flash). Values: 'system' | 'light' | 'dark'.
      // Runtime changes go through src/lib/platform/theme.ts (applyTheme), which mirrors this logic:
      // a forced theme collapses the two media-scoped theme-color metas into one of its colour.
      (function () {
      try {
        var t = localStorage.getItem('homecare.theme');
        if (t === 'light' || t === 'dark' || t === 'system')
          document.documentElement.dataset.theme = t;
        if (t === 'light' || t === 'dark') {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 1; i < metas.length; i++) metas[i].remove();
          metas[0].removeAttribute('media');
          metas[0].setAttribute('content', t === 'dark' ? '#1C1714' : '#FBF6EF');
        }
      } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
