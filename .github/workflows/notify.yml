# HomeCare notifier: every 5 minutes, read Firestore and send due web-push notifications via FCM.
# This cron job IS the backend (Firebase Spark plan, no Cloud Functions). See scripts/notify/README.md.
# Without the FIREBASE_SERVICE_ACCOUNT secret every run exits green after a notice: nothing to do.
#
# Timing: GitHub's own schedule fires only every 2.5-6 hours, so an external scheduler (cron-job.org,
# SETUP.md section 6) starts this workflow every 5 minutes through the workflow_dispatch REST API.
# The schedule stays as a fallback. Extra or late runs are harmless: runs never overlap
# (concurrency) and every push is deduplicated.
name: notify

on:
  schedule:
    - cron: '*/5 * * * *' # fallback only: GitHub actually runs it every few hours
  # POST /repos/eladcdr-del/tasks-management-app/actions/workflows/notify.yml/dispatches
  # with {"ref":"ccr-4db4aa05-kbrwag"}, every 5 minutes from cron-job.org
  workflow_dispatch:

# One run at a time: a run queued meanwhile waits, and a newer queued one replaces it.
concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive: re-enable this workflow so GitHub's 60-day inactivity rule never disables it

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same rule as scripts/notify/guard.ts (shouldRun), in shell so the skip path needs nothing installed.
      - name: Guard (skip quietly without the secret)
        id: guard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret missing — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node 22
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/notify/package-lock.json

      - name: Install notifier dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci --prefix scripts/notify --no-audit --no-fund

      - name: Run notifier
        if: steps.guard.outputs.run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx --prefix scripts/notify tsx scripts/notify/index.ts

      # Scheduled workflows in a repo with no commits for 60 days get disabled. Re-enabling through the
      # API (the keepalive-workflow "API" method, no commits) resets that timer. The call is idempotent
      # and costs one API request, so it runs on EVERY run, scheduled or dispatched: with runs hours
      # apart at random minutes, a narrower time slot was practically never hit. Runs even without the
      # secret and even if the notifier failed, so the schedule survives until the secret is added. A
      # failed call only warns (the next run tries again) instead of turning the run red.
      - name: Keepalive (re-enable this workflow on every run)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/notify.yml/enable"; then
            echo "keepalive: workflow enable call sent"
          else
            echo "::warning::keepalive: the enable call failed; the next run tries again"
          fi
