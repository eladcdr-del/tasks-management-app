name: deploy

# Builds the app and publishes it to GitHub Pages:
# https://eladcdr-del.github.io/tasks-management-app/
# Runs on every push to the default branch, and on demand (Actions → deploy → Run workflow).

on:
  push:
    branches: [main, ccr-4db4aa05-kbrwag]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job end to end: it needs a single hosted runner. With build and deploy as two jobs, the
  # second sometimes waited 15 minutes for a runner and was cancelled ("The job was not acquired by
  # Runner of type hosted"), leaving a green build that never went live.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
        env:
          BASE_PATH: /tasks-management-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
